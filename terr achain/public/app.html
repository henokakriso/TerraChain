<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TerraChain</title>
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>

<!-- Mobile hamburger -->
<button class="hamburger" id="hamburger" aria-label="Open menu">
  <i></i><i></i><i></i>
</button>
<div class="sidebar-overlay" id="overlay"></div>

<div id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="brand-mark">TC</span><span>TerraChain</span></div>
    <nav id="nav">
      <a href="#dashboard">Dashboard</a>
      <a href="#parcels">Land parcels</a>
      <a href="#applications">Applications</a>
      <a href="#tenders">Tenders</a>
      <a href="#bids">Bids</a>
      <a href="#contracts">Contracts</a>
      <a href="#payments">Payments</a>
      <a href="#documents">Documents</a>
      <a href="#organizations">Organizations</a>
      <a href="#integrations">Institutions</a>
      <a href="#chat">Chat <span id="chatBadge" class="chip hidden"></span></a>
      <a href="#audit">Audit log</a>
      <a href="#integrity">Integrity</a>
      <a href="#admin">Administration</a>
    </nav>
    <div class="who">
      <div class="name" id="whoName">…</div>
      <div id="whoRole"></div>
      <div style="margin-top:8px"><a href="#" id="logoutLink" style="color:rgba(255,255,255,0.45)">Sign out</a></div>
    </div>
  </aside>
  <main class="main">
    <header>
      <h2 id="pageTitle">Dashboard</h2>
      <p class="sub" id="pageSub"></p>
    </header>
    <div id="msg" class="msg msg-error"></div>
    <div id="view"></div>
  </main>
</div>

<script>
// Mobile sidebar toggle
(function () {
  var btn = document.getElementById('hamburger');
  var sidebar = document.getElementById('sidebar');
  var overlay = document.getElementById('overlay');
  function open() {
    sidebar.classList.add('open');
    overlay.classList.add('open');
  }
  function close() {
    sidebar.classList.remove('open');
    overlay.classList.remove('open');
  }
  btn.addEventListener('click', function () {
    sidebar.classList.contains('open') ? close() : open();
  });
  overlay.addEventListener('click', close);
  // Close on nav link tap (mobile)
  document.getElementById('nav').addEventListener('click', function (e) {
    if (e.target.tagName === 'A') close();
  });
})();
</script>
<script src="/assets/app.js"></script>
</body>
</html>
