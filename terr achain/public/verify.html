<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Document verification — TerraChain</title>
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div class="verify-wrap">
  <div class="verify-card">
    <div class="seal seal-good" id="seal">?</div>
    <h1>TerraChain document verification</h1>
    <p class="meta" id="result">Enter a verification token below. Only minimal public information is shown (spec section 25).</p>
    <div style="height:14px"></div>
    <form id="vf">
      <label for="token">Verification token</label>
      <input id="token" name="token" autocomplete="off" required placeholder="e.g. UDIRUNVUFV...">
      <button type="submit" class="btn btn-block">Verify document</button>
    </form>
    <p class="meta" id="foot" style="margin-top:22px;font-size:11px">TerraChain — Federal Democratic Republic of Ethiopia</p>
  </div>
</div>

<script>
(function () {
  'use strict';
  var form = document.getElementById('vf');
  var result = document.getElementById('result');
  var seal = document.getElementById('seal');
  var tokenInput = document.getElementById('token');

  function set(ok, title, lines) {
    seal.className = 'seal ' + (ok ? 'seal-good' : 'seal-bad');
    seal.textContent = ok ? '\u2713' : '\u2717';
    var html = '<b style="font-size:16px">' + title + '</b><br>';
    lines.forEach(function (l) { html += l + '<br>'; });
    result.innerHTML = html;
  }

  (function fromQuery() {
    var q = new URLSearchParams(window.location.search).get('token');
    if (q) { tokenInput.value = q; form.requestSubmit(); }
  })();

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var token = tokenInput.value.trim();
    if (!token) return;
    result.textContent = 'Verifying\u2026';
    fetch('/api/v1/verification/' + encodeURIComponent(token))
      .then(function (r) { return r.json().then(function (b) { return { status: r.status, body: b }; }); })
      .then(function (r) {
        if (r.status !== 200) {
          set(false, 'Not verified', [r.body.message || 'The token is unknown or invalid.']);
          return;
        }
        var d = r.body.data || {};
        var lines = [];
        if (d.document_no) lines.push('Document: <b>' + d.document_no + '</b>');
        if (d.document_type) lines.push('Type: ' + d.document_type);
        if (d.issue_date) lines.push('Issued: ' + d.issue_date);
        if (d.issued_by) lines.push('Issued by: ' + d.issued_by);
        if (d.status) lines.push('Status: ' + d.status);
        if (d.result) lines.push('Result: <b>' + d.result.toUpperCase() + '</b>');
        if (!lines.length) lines.push('The document exists in the registry.');
        set(true, 'Document verified', lines);
      })
      .catch(function (err) {
        set(false, 'Verification unavailable', ['Network error: ' + err.message]);
      });
  });
})();
</script>
</body>
</html>
